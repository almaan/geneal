[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneal"
version = "0.1.0"
description = "Active learning for gene-knockout selection on molecular data"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "gpytorch",
    "pyro-ppl",
    "torch",
    "hydra-core",
    "jinja2",
    "plotly",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]
# static (vector) figure export for manuscript figures; 0.2.1 is self-contained
# (bundles its own chromium; >=1.0 needs an external chrome).
figures = ["kaleido==0.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
